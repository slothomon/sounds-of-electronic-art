<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="theme-color" content="#151210">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="{{ canonical_url }}">
  <link rel="icon" href="{{ base_path }}/assets/icons/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="sounds of electronic art">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ social_image_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ social_image_url }}">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('sofea-theme') || 'dark';
        document.documentElement.dataset.theme = ['dark', 'light'].includes(theme) ? theme : 'dark';
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ base_path }}/assets/css/site.css">
</head>
<body data-home-url="{{ home_href }}" data-home-title="{{ page_title }}">
  <a class="skip-link" href="#main" data-i18n="skip">Zum Inhalt springen</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ home_href }}" aria-label="sounds of electronic art Startseite">
        <span class="brand-vector">{{ logo_svg }}</span>
      </a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="{{ home_href }}#upcoming" data-i18n="nav_next">Demnächst</a>
        <a href="{{ home_href }}#listen" data-i18n="nav_listen">Hören</a>
        <a href="{{ home_href }}#about" data-i18n="nav_about">Über uns</a>
        <a href="{{ home_href }}#archive" data-i18n="nav_archive">Archiv</a>
        <a class="listen-link" href="{{ radio_stream_url }}" target="_blank" rel="noopener noreferrer" aria-label="Livestream von Radio Blau">
          <span class="stream-link-label" data-language-panel="de"><span>Livestream</span><small>Radio Blau</small></span>
          <span class="stream-link-label" data-language-panel="en" hidden><span>Live stream</span><small>Radio Blau</small></span>
        </a>
      </nav>
      <div class="header-tools">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Helles Thema aktivieren" title="Helles Thema aktivieren">
          <span aria-hidden="true" data-theme-icon>☀</span>
        </button>
        <div class="language-switch" role="group" aria-label="Sprache wählen">
          <button type="button" data-language="de" aria-pressed="true">DE</button>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="legal-main">
    {{ legal_content }}
  </main>

  <footer class="footer">
    <div class="shell footer-grid">
      <div class="footer-logo">
        <span class="brand-vector">{{ logo_svg }}</span>
      </div>
      <div class="footer-links">
        {{ social_html }}
        <a href="{{ home_href }}impressum.html" data-i18n="imprint_link">Impressum</a>
        <a href="{{ home_href }}datenschutz.html" data-i18n="privacy_link">Datenschutz</a>
      </div>
      <a class="footer-partner" href="{{ radio_home_url }}" target="_blank" rel="noopener noreferrer" aria-label="Radio Blau in einem neuen Tab öffnen">
        <span class="footer-partner-label" data-bilingual data-de="Ausgestrahlt auf" data-en="Broadcast on">Ausgestrahlt auf</span>
        <span class="footer-partner-logo">
          <img src="{{ base_path }}/assets/images/radioblau-logo.png" alt="Radio Blau">
        </span>
        <span class="footer-partner-url">radioblau.de</span>
      </a>
      <div class="footer-meta">
        <span>© <span data-current-year>{{ build_year }}</span> sounds of electronic art</span>
      </div>
    </div>
  </footer>
  <button class="back-to-top" type="button" data-back-to-top aria-hidden="true" tabindex="-1" aria-label="Nach oben">
    <span aria-hidden="true">↑</span>
  </button>
  <script src="{{ base_path }}/assets/js/site.js" defer></script>
</body>
</html>

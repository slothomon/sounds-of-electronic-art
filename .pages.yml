media:
  - name: episode-images
    label: Sendungs- und Veranstaltungsbilder
    input: assets/images/uploads
    output: /assets/images/uploads
    rename: safe
    extensions: [jpg, jpeg, png, webp]

components:
  editorial_links:
    type: object
    label: Weitere Links
    list:
      collapsible:
        collapsed: true
        summary: "{label_de}"
    fields:
      - name: label_de
        label: Beschriftung (Deutsch)
        type: string
        required: true
      - name: label_en
        label: Beschriftung (Englisch)
        type: string
      - name: url
        label: URL
        type: string
        required: true
      - name: primary
        label: Hervorgehoben
        type: boolean
        default: false

content:
  - name: upcoming-broadcasts
    label: Demnächst – Sendungen
    type: file
    path: content/upcoming-broadcasts.json
    format: json
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: date
        label: Beginn
        type: date
        required: true
        description: Leipziger Ortszeit. Der Build berücksichtigt Sommer- und Winterzeit.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
          step: 3600
      - name: episode_number
        label: Sendungsnummer (optional)
        type: number
        description: Wird normalerweise automatisch vergeben. Nur für einen bewussten Override setzen.
        options:
          min: 1
      - name: title_de
        label: Titel (Deutsch)
        type: string
        required: true
      - name: title_en
        label: Titel (Englisch)
        type: string
        required: true
        description: Kann mit dem deutschen Titel identisch sein.
      - name: details_de
        label: Text (Deutsch)
        type: text
        required: true
        description: Wird auf der Startseite automatisch gekürzt und in der Detailansicht vollständig gezeigt.
      - name: details_en
        label: Text (Englisch)
        type: text
        required: true
      - name: image
        label: Bild / Artwork
        type: image
        options:
          media: episode-images
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: links
        component: editorial_links

  - name: upcoming-events
    label: Demnächst – Veranstaltungen
    type: file
    path: content/upcoming-events.json
    format: json
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: date
        label: Beginn
        type: date
        required: true
        description: Leipziger Ortszeit. Der Build berücksichtigt Sommer- und Winterzeit.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
          step: 3600
      - name: end
        label: Ende (optional)
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
          step: 3600
      - name: title_de
        label: Titel (Deutsch)
        type: string
        required: true
      - name: title_en
        label: Titel (Englisch)
        type: string
        required: true
        description: Kann mit dem deutschen Titel identisch sein.
      - name: details_de
        label: Text (Deutsch)
        type: text
        required: true
        description: Wird auf der Startseite automatisch gekürzt und in der Detailansicht vollständig gezeigt.
      - name: details_en
        label: Text (Englisch)
        type: text
        required: true
      - name: location
        label: Veranstaltungsort
        type: string
        required: true
        description: Zum Beispiel „Conne Island, Leipzig“.
      - name: image
        label: Bild / Flyer
        type: image
        options:
          media: episode-images
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: links
        component: editorial_links

  - name: listen-selection
    label: Hören – Auswahl
    type: file
    path: content/listen.json
    format: json
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: label
        label: Bezeichnung im CMS
        type: string
        required: true
        description: Nur zur Orientierung im CMS; die Website übernimmt Titel und Text aus dem Archiv.
      - name: episode_id
        label: Sendungs-ID
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9][a-z0-9-]{2,95}$"
          message: Nur Kleinbuchstaben, Ziffern und Bindestriche verwenden.
        description: Die ID steht beim zugehörigen Eintrag im Bereich Sendungsarchiv. Die Reihenfolge hier bestimmt die Reihenfolge unter Hören. Maximal fünf Einträge.

  - name: episode-numbers
    label: Sendungsnummern
    type: file
    path: content/episode-numbers.json
    format: json
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: date
        label: Sendungsdatum
        type: date
        required: true
        description: Eine Zeile pro tatsächlich ausgestrahlter Sendung. Die Dateireihenfolge ist egal.
        options:
          format: yyyy-MM-dd
      - name: episode_number
        label: Sendungsnummer
        type: number
        required: true
        description: Alle Sets mit demselben Sendungsdatum erhalten automatisch diese Nummer.
        options:
          min: 1

  - name: archive-episodes
    label: Sendungsarchiv
    type: file
    path: content/episodes.json
    format: json
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: episode_id
        label: Sendungs-ID
        type: string
        pattern:
          regex: "^[a-z0-9][a-z0-9-]{2,95}$"
          message: Nur Kleinbuchstaben, Ziffern und Bindestriche verwenden.
        description: Stabile interne ID, z. B. 2026-03-14-neele. Falls leer, leitet der Build sie aus Datum und Titel ab. Nach der Verwendung unter Hören nicht mehr ändern.
      - name: date
        label: Sendungsdatum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: episode_number
        label: Sendungsnummer (optional)
        type: number
        description: Normalerweise automatisch über das Sendungsdatum; hier nur als Override verwenden.
        options:
          min: 1
      - name: updated_at
        label: Inhalt zuletzt wesentlich geändert
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: title_de
        label: Titel (Deutsch)
        type: string
        required: true
      - name: title_en
        label: Titel (Englisch)
        type: string
        required: true
        description: Kann mit dem deutschen Titel identisch sein.
      - name: audio_url
        label: SoundCloud-URL
        type: string
        required: true
        description: Exakt die öffentliche URL der Aufnahme verwenden.
      - name: details_de
        label: Text (Deutsch, optional)
        type: text
        description: Falls leer, wird der Text aus SoundCloud verwendet. In der Archivliste wird der Text automatisch gekürzt.
      - name: details_en
        label: Text (Englisch, optional)
        type: text
      - name: image
        label: Bild / Artwork (optional)
        type: image
        description: Falls leer, wird das lokal zwischengespeicherte SoundCloud-Artwork verwendet.
        options:
          media: episode-images
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: music_presentations
        label: Musikvorstellungen
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{artist} – {title}"
        fields:
          - name: artist
            label: Künstler:in
            type: string
          - name: title
            label: Veröffentlichung / Titel
            type: string
            required: true
          - name: label
            label: Label
            type: string
          - name: year
            label: Jahr
            type: number
            options:
              min: 1900
              max: 2100
          - name: url
            label: Discogs-, Bandcamp- oder Label-Link
            type: string
          - name: note_de
            label: Notiz (Deutsch)
            type: text
          - name: note_en
            label: Notiz (Englisch)
            type: text
      - name: tracklist
        label: Tracklist
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{time} {artist} – {title}"
        fields:
          - name: time
            label: Zeitmarke
            type: string
            description: Optional, z. B. 00:00 oder 01:23:45.
          - name: artist
            label: Künstler:in
            type: string
          - name: title
            label: Track
            type: string
            required: true
          - name: label
            label: Label
            type: string
          - name: url
            label: Link
            type: string

  - name: broadcast-schedule
    label: Sendungsplanung
    type: file
    path: content/broadcast-schedule.json
    format: json
    operations:
      rename: false
      delete: false
    fields:
      - name: anchor
        label: Erster regulärer Termin
        type: date
        readonly: true
        description: Referenztermin des 8-Wochen-Rhythmus.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
      - name: first_episode_number
        label: Sendungsnummer am Referenztermin
        type: number
        readonly: true
      - name: interval_weeks
        label: Abstand in Wochen
        type: number
        readonly: true
      - name: horizon_months
        label: Planungshorizont in Monaten
        type: number
        required: true
        description: Reguläre Sendungen werden mindestens so weit im Voraus erzeugt.
        options:
          min: 1
          max: 24
      - name: skip_dates
        label: Ausfallende Sendungen
        type: date
        list: true
        description: Reguläre Termine, die komplett ausfallen. Ein Ausfall verbraucht keine Sendungsnummer.
        options:
          format: "yyyy-MM-dd"
      - name: date_overrides
        label: Verschobene Sendungen
        type: object
        description: Verschiebt einen regulären Termin, behält aber dessen stabile ID und Sendungsnummer.
        list:
          collapsible:
            collapsed: true
            summary: "{date} → {new_date}"
        fields:
          - name: date
            label: Regulärer Termin
            type: date
            required: true
            options:
              format: "yyyy-MM-dd"
          - name: new_date
            label: Neuer Termin
            type: date
            required: true
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ss"
              step: 3600
      - name: details_de
        label: Standardtext (Deutsch)
        type: text
        required: true
        description: Wird nur für neu automatisch angelegte Sendungen verwendet.
      - name: details_en
        label: Standardtext (Englisch)
        type: text
        required: true
        description: Wird nur für neu automatisch angelegte Sendungen verwendet.
settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"

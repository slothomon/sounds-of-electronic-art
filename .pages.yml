media:
  - name: episode-images
    label: Sendungs- und Veranstaltungsbilder
    input: assets/images/uploads
    output: /assets/images/uploads
    rename: safe
    extensions: [jpg, jpeg, png, webp]

components:
  editorial_links:
    type: object
    label: Weitere Links
    list:
      collapsible:
        collapsed: true
        summary: "{label_de}"
    fields:
      - name: label_de
        label: Beschriftung (Deutsch)
        type: string
        required: true
      - name: label_en
        label: Beschriftung (Englisch)
        type: string
      - name: url
        label: URL
        type: string
        required: true
      - name: primary
        label: Hervorgehoben
        type: boolean
        default: false

content:
  - name: upcoming-broadcasts
    label: Demnächst – Sendungen
    type: file
    path: content/upcoming-broadcasts.json
    format: json
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: date
        label: Beginn
        type: date
        required: true
        description: Leipziger Ortszeit. Der Build berücksichtigt Sommer- und Winterzeit.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
          step: 3600
      - name: episode_number
        label: Sendungsnummer (optional)
        type: number
        description: Zum Beispiel 100. Wird in Detailseiten und strukturierten Daten verwendet.
        options:
          min: 1
          max: 9999
      - name: title_de
        label: Titel (Deutsch)
        type: string
        required: true
      - name: title_en
        label: Titel (Englisch)
        type: string
        required: true
        description: Kann mit dem deutschen Titel identisch sein.
      - name: details_de
        label: Text (Deutsch)
        type: text
        required: true
        description: Wird auf der Startseite automatisch gekürzt und in der Detailansicht vollständig gezeigt.
      - name: details_en
        label: Text (Englisch)
        type: text
        required: true
      - name: image
        label: Bild / Artwork
        type: image
        options:
          media: episode-images
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: links
        component: editorial_links

  - name: upcoming-events
    label: Demnächst – Veranstaltungen
    type: file
    path: content/upcoming-events.json
    format: json
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: date
        label: Beginn
        type: date
        required: true
        description: Leipziger Ortszeit. Der Build berücksichtigt Sommer- und Winterzeit.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
          step: 3600
      - name: end
        label: Ende (optional)
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
          step: 3600
      - name: title_de
        label: Titel (Deutsch)
        type: string
        required: true
      - name: title_en
        label: Titel (Englisch)
        type: string
        required: true
        description: Kann mit dem deutschen Titel identisch sein.
      - name: details_de
        label: Text (Deutsch)
        type: text
        required: true
        description: Wird auf der Startseite automatisch gekürzt und in der Detailansicht vollständig gezeigt.
      - name: details_en
        label: Text (Englisch)
        type: text
        required: true
      - name: location
        label: Veranstaltungsort
        type: string
        required: true
        description: Zum Beispiel „Conne Island, Leipzig“.
      - name: image
        label: Bild / Flyer
        type: image
        options:
          media: episode-images
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: links
        component: editorial_links

  - name: archive-episodes
    label: Sendungsarchiv
    type: file
    path: content/episodes.json
    format: json
    list: true
    operations:
      rename: false
      delete: false
    fields:
      - name: date
        label: Sendungsdatum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated_at
        label: Inhalt zuletzt wesentlich geändert
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: episode_number
        label: Sendungsnummer (optional)
        type: number
        description: Zum Beispiel 100. Wird in Detailseiten und strukturierten Daten verwendet.
        options:
          min: 1
          max: 9999
      - name: title_de
        label: Titel (Deutsch)
        type: string
        required: true
      - name: title_en
        label: Titel (Englisch)
        type: string
        required: true
        description: Kann mit dem deutschen Titel identisch sein.
      - name: audio_url
        label: SoundCloud-URL
        type: string
        required: true
        description: Exakt die öffentliche URL der Aufnahme verwenden.
      - name: details_de
        label: Text (Deutsch, optional)
        type: text
        description: Falls leer, wird der Text aus SoundCloud verwendet. In der Archivliste wird der Text automatisch gekürzt.
      - name: details_en
        label: Text (Englisch, optional)
        type: text
      - name: image
        label: Bild / Artwork (optional)
        type: image
        description: Falls leer, wird das lokal zwischengespeicherte SoundCloud-Artwork verwendet.
        options:
          media: episode-images
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: music_presentations
        label: Musikvorstellungen
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{artist} — {title}"
        fields:
          - name: artist
            label: Künstler:in
            type: string
          - name: title
            label: Veröffentlichung / Titel
            type: string
            required: true
          - name: label
            label: Label
            type: string
          - name: year
            label: Jahr
            type: number
            options:
              min: 1900
              max: 2100
          - name: url
            label: Discogs-, Bandcamp- oder Label-Link
            type: string
          - name: note_de
            label: Notiz (Deutsch)
            type: text
          - name: note_en
            label: Notiz (Englisch)
            type: text
      - name: tracklist
        label: Tracklist
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{time} {artist} — {title}"
        fields:
          - name: time
            label: Zeitmarke
            type: string
            description: Optional, z. B. 00:00 oder 01:23:45.
          - name: artist
            label: Künstler:in
            type: string
          - name: title
            label: Track
            type: string
            required: true
          - name: label
            label: Label
            type: string
          - name: url
            label: Link
            type: string

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"

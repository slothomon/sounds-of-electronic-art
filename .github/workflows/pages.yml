name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install archive updater
        run: |
          python -m pip install --disable-pip-version-check -r requirements-archive.txt
          python -m playwright install --with-deps chromium

      - name: Refresh static SoundCloud archive cache
        run: python scripts/update_archive.py

      - name: Persist changed archive cache
        run: |
          if git diff --quiet -- content/archive-cache.json; then
            echo "Archive cache is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/archive-cache.json
          git commit -m "Update SoundCloud archive cache [skip ci]"
          git push || echo "Cache commit could not be pushed; deployment will still use the refreshed cache."

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: python scripts/build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

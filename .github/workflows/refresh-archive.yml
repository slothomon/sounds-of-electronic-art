name: Refresh SoundCloud archive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: soundcloud-archive-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-archive.txt

      - name: Install archive updater
        run: python -m pip install --disable-pip-version-check -r requirements-archive.txt

      - name: Refresh archive cache
        run: python scripts/update_archive.py --strict

      - name: Validate archive cache
        run: python -m json.tool content/archive-cache.json > /dev/null

      - name: Commit changed cache and artwork
        run: |
          if [ -z "$(git status --porcelain -- content/archive-cache.json assets/images/episodes)" ]; then
            echo "Archive cache and artwork are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/archive-cache.json assets/images/episodes
          git commit -m "Update SoundCloud archive cache and artwork"
          git pull --rebase origin main
          git push origin HEAD:main

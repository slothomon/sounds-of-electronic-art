name: Refresh SoundCloud archive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: soundcloud-archive-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-archive.txt

      - name: Install archive updater
        run: python -m pip install --disable-pip-version-check -r requirements-archive.txt

      - name: Refresh archive cache
        run: python scripts/update_archive.py --strict

      - name: Maintain upcoming broadcast schedule
        run: python scripts/update_schedule.py
      - name: Validate archive cache
        run: python -m json.tool content/archive-cache.json > /dev/null

      - name: Commit changed cache and artwork
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- content/archive-cache.json assets/images/episodes content/upcoming-broadcasts.json)" ]; then
            echo "Archive cache and artwork are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/archive-cache.json assets/images/episodes content/upcoming-broadcasts.json
          git commit -m "Update archive cache, artwork and broadcast schedule"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy changed archive
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden — sounds of electronic art</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#151210">
  <link rel="icon" href="{{ base_path }}/assets/icons/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem('sofea-theme');
        const theme = ['dark', 'light'].includes(storedTheme) ? storedTheme : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          theme === 'light' ? '#fdf6e3' : '#151210'
        );
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ base_path }}/assets/css/site.css?v={{ asset_version }}">
</head>
<body>
  <main class="hero" id="main">
    <div class="shell hero-grid">
      <div>
        <p class="eyebrow">404 · Signal verloren</p>
        <h1 class="not-found-title">nicht<br>auf<br>sendung</h1>
        <p class="hero-subtitle">Diese Frequenz ist still. Zurück zu sounds of electronic art.</p>
        <div class="actions"><a class="button button-primary" href="{{ base_path }}/">Zur Startseite</a></div>
      </div>
      <div class="hero-art" aria-hidden="true"><div class="frequency">—.—<small>Kein Signal</small></div></div>
    </div>
  </main>
</body>
</html>

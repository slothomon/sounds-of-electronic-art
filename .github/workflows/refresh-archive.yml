name: Refresh SoundCloud archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: soundcloud-archive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install archive updater
        run: python -m pip install --disable-pip-version-check -r requirements-archive.txt

      - name: Refresh archive cache
        run: python scripts/update_archive.py --strict

      - name: Commit changed archive cache
        id: cache
        run: |
          if git diff --quiet -- content/archive-cache.json; then
            echo "Archive cache is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/archive-cache.json
          git commit -m "Update SoundCloud archive cache"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deployment for changed cache
        if: steps.cache.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

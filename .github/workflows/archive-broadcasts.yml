name: Archive completed broadcasts

on:
  workflow_dispatch:
  schedule:
    # Standard SOFEA broadcasts end at midnight Leipzig time. This runs well
    # before the nightly SoundCloud/archive refresh that currently prunes past
    # upcoming entries.
    - cron: "17 0 * * *"

concurrency:
  group: archive-completed-broadcasts
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Archive completed broadcasts
        run: python scripts/archive_broadcasts.py

      - name: Validate source data
        run: python scripts/validate_site.py --source

      - name: Commit archived broadcasts
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- content/upcoming-broadcasts.json content/episodes.json content/episode-numbers.json)" ]; then
            echo "No completed broadcasts to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/upcoming-broadcasts.json content/episodes.json content/episode-numbers.json
          git commit -m "Archive completed broadcasts"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy changed archive
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
